name: Deploy HDHive OAuth

on:
  push:
    branches: [main]
    paths:
      - 'services/hdhive-oauth/**'
      - '.github/workflows/deploy-hdhive.yml'
  workflow_dispatch:

concurrency:
  group: hdhive-production
  cancel-in-progress: true

# Deployment is intentionally serialized so two updates cannot restart the service at once.

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_SSH_PORT || '22' }}
          script_stop: true
          script: |
            set -e
            cd /opt/hdhive-oauth
            docker compose pull
            docker compose up -d --force-recreate
            sleep 5
            curl --fail --silent --show-error http://127.0.0.1:8765/health
            docker compose ps
