name: Deploy HDHive OAuth

on:
  # Deploy only after the image workflow has finished publishing `latest`.
  # A push-triggered deploy could pull the previous image while the build was
  # still running, making a successful deployment appear unchanged.
  workflow_run:
    workflows: ["Build HDHive OAuth image"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: hdhive-production
  cancel-in-progress: true

# Deployment is intentionally serialized so two updates cannot restart the service at once.

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 47.251.38.52
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_SSH_PORT || '22' }}
          script_stop: true
          script: |
            set -e
            cd /opt/hdhive-oauth
            docker compose pull
            docker compose up -d --force-recreate
            sleep 5
            curl --fail --silent --show-error http://127.0.0.1:8765/health
            docker compose ps
